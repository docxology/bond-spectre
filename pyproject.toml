# SPECTRE Configuration — NINE EYES surveillance-network mission package
# Inside the BOND suite this file inherits workspace settings from the suite
# root pyproject.toml; the standalone clone builds its own, so the table below
# declares what this repository's gate runs under, and it excludes the vendored
# copy from both ruff and mypy.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectre"
version = "0.1.0"
license = {text = "MIT"}
description = "NINE EYES — surveillance-network, criminal-org intelligence, and network-geometry analysis for the BOND film suite (Spectre, 2015)"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "bond-api",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
]

# Local path dependency on the FROZEN bond-api protocol (Layer 1). The pure
# domain core in src/spectre/{surveillance_net,org_intel,network_geometry}.py
# does NOT import bond-api (importable standalone); mission.py is the thin
# adapter that implements the Frozen MissionProvider contract. The path below
# resolves to the vendored copy of bond-api, so a standalone clone syncs; the
# copy is byte-identical to upstream and must not be repointed at a registry,
# whose bond-api name belongs to an unrelated project.
[tool.uv.sources]
bond-api = { path = "vendor/bond-api" }

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
# Project-local mypy settings (the monorepo root config has no mypy_path for
# this package's src/ layout). Mirrors the root gates.
# Vendored copies are a dependency; their bytes are bound by scripts/vendor.py.
exclude = ["(^|/)vendor/"]
python_version = "3.10"
mypy_path = ["src"]
explicit_package_bases = true
warn_return_any = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bond_api.*"
ignore_missing_imports = true

[tool.uv]
# No uv overrides here: in the suite the workspace root supplies them, and a
# standalone clone runs on uv's defaults.

[tool.ruff]
# The vendored copies are byte-identical to upstream and must stay that way.
extend-exclude = ["vendor"]
