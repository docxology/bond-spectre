# Claim ledger — one row per measured manuscript token.
#
# Coverage is enforced, not asserted: tests/test_claim_ledger.py compares this
# file against measured_tokens(generate_variables()) and fails if a measured
# token has no row, a row names a token that is no longer measured, or a
# recorded value differs from the value the code now produces. Values are the
# exact rendered token strings, so a formatting change is drift too.

claims:
  - claim_id: articulation-nodes
    token: SPECTRE_ARTICULATION_NODES
    kind: text
    value: "US"
    source: "spectre.network_geometry.articulation_points labels"
    source_tier: generated_metric
    freshness: active
    artifact_path: output/data/manuscript_variables.json
  - claim_id: cascade-coverage
    token: SPECTRE_CASCADE_COVERAGE
    kind: number
    value: "0.7556"
    source: "spectre.surveillance_net.expected_cascade_coverage(('US',), 0.6, trials=50, seed=11)"
    source_tier: generated_metric
    freshness: active
    artifact_path: output/data/manuscript_variables.json
  - claim_id: cascade-trials
    token: SPECTRE_CASCADE_TRIALS
