domain: network_intelligence
display_name: "Spectre NINE EYES — surveillance-network & org-intel analysis"
required_packages:
  - numpy
  - matplotlib
  - pyyaml
  - bond-api
preferred_outputs:
  - data
  - figure
validation_gates:
  - coverage_90
  - zero_mock
  - determinism
  - protocol_compliance
figure_types:
  - network_flow_centralization
citation_policy: official_or_scholarly
source_policy: "Prefer the canonical NINE EYES dataset declared in src/spectre/mission.py and scholarly network-analysis references (Freeman, Newman)."
review_gates:
  - coverage_90
  - zero_mock
  - determinism
artifact_expectations:
  - output/data/nine_eyes_debrief.json
  - output/data/manuscript_variables.json
  - output/figures/network_flow_centralization.png
benchmark_rubric:
  name: network-intelligence-readiness
  dimensions:
    - name: output_validity
      weight: 1.0
    - name: determinism
      weight: 1.0
    - name: protocol_compliance
      weight: 2.0
    - name: coverage_quality
      weight: 1.0
llm_prompt_guidance: "Use the measured NINE EYES mission results (via src/spectre/manuscript_variables.py) as the evidence source; do not invent numeric results."
