# SPECTRE — NINE EYES mission configuration
# Consumed by scripts/z_generate_manuscript_variables.py (via
# src/spectre/manuscript_variables.py) and the rendering pipeline. Metrics are
# never hand-authored here: they flow from the deterministic NINE EYES mission
# provider's execute() step through src/spectre/manuscript_variables.py.

paper:
  # RASP Standard: Title must be descriptive and objective
  title: "Spectre: NINE EYES — Special-Agent Mission Software"
  subtitle: "Surveillance-Network Centralization, Criminal-Org Cell Structure, and Critical-Node Geometry"
  version: "0.1.0"
  date: "2026-08-04" # Auto-generated via infrastructure validator if empty

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

publication:
  # Local-only working tree: no remote, no DOI. Dropped per the BOND fork
  # contract (metadata sidecars omit DOI fields).
  github_repository: "docxology/spectre"
  repository_url: "https://github.com/docxology/spectre"
  journal: "BOND Mission Software Series"
  year: "2026"

keywords:
  - "surveillance networks"
  - "data-flow centralization"
  - "criminal-organisation intelligence"
  - "cell compartmentalization"
  - "network geometry"
  - "critical nodes"
  - "cascade coverage"
  - "active inference"

metadata:
  license: "MIT"
  language: "en"

# Render format toggles.
render:
  formats:
    pdf: false
    html: false
    slides: false
    docx: false
    epub: false

# ZERO-MOCK TOLERANCE: any failure blocks manuscript rendering.
testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0
